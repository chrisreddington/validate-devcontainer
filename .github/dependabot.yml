version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-all:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - major
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer dependency currently caps at
      # typescript ">=4.8.4 <6.1.0", so a major bump to typescript 7.x
      # breaks dependency resolution for the whole npm-development group.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
